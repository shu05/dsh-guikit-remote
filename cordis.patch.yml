# dsh-guikit-remote bundle patch — inserts the remote GUI toolkit plugin.
# Defaults below are for this deployment (dsh on the Linux server, Windows box
# "ph" at 192.168.0.240). Override any of it in the profile's cordis.patch.yml.
#
#   mcp.url / mcp.token  — windows-mcp streamable-http endpoint (interactive
#                          session; the only channel that can see the desktop).
#                          Token comes from WIN_MCP_KEY in $DSH_HOME/.env.
#   ssh.*                — scp channel used ONLY to pull screenshot PNGs back
#                          to the server (SSH-spawned processes cannot touch
#                          the desktop, but they transfer files fine).
#   gate.maxWaitMs       — how long a tool waits out the desktop-gate while the
#                          user is at the machine (both windows-mcp and daemon).
#   daemon.*             — resident PowerShell microserver on 127.0.0.1:port,
#                          reached through a persistent `ssh -N -L` tunnel.
#                          Kills the per-call PowerShell spawn (~0.4s) and the
#                          scp round-trip for screenshots; click/key + auto
#                          screenshot land in ONE round trip. enabled:false
#                          forces the windows-mcp path for everything.
#                          gateIdleMs: user-idle threshold before the daemon
#                          accepts input; idleExitMin: daemon auto-exit.
#   vision.gpu           — which video card runs gui_vision inference:
#                          "host"   = the controlled Windows machine (its GPU),
#                          "server" = the machine running dsh (its GPU).
#   vision.host / .server — OpenAI-compatible endpoints per backend.
- insert:
    - id: dsh-guikit-remote
      name: dsh-guikit-remote
      config:
        mcp:
          url: http://192.168.0.240:8000/mcp
          token: !!js process.env.WIN_MCP_KEY || ''
        ssh:
          host: 192.168.0.240
          user: admin
          port: 22
        gate:
          maxWaitMs: 120000
        daemon:
          enabled: true
          port: 18742
          gateIdleMs: 1500
          idleExitMin: 15
          jpegQuality: 80
        vision:
          gpu: host
          host:
            baseUrl: http://192.168.0.240:11434/v1
            model: qwen3-vl:2b-instruct
            apiKey: ollama
            timeoutMs: 120000
          server:
            baseUrl: http://127.0.0.1:11434/v1
            model: qwen3-vl:2b-instruct
            apiKey: local
            timeoutMs: 120000
            manage: true
            strataUrl: http://127.0.0.1:8193
            reserveMib: 5120
            unloadMs: 120000
